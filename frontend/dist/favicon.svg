<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Bus body -->
  <rect x="10" y="30" width="80" height="45" rx="8" fill="url(#busGrad)"/>
  <!-- Windows -->
  <rect x="18" y="38" width="15" height="12" rx="2" fill="#E0F2FE"/>
  <rect x="38" y="38" width="15" height="12" rx="2" fill="#E0F2FE"/>
  <rect x="58" y="38" width="15" height="12" rx="2" fill="#E0F2FE"/>
  <!-- Windshield -->
  <rect x="78" y="35" width="8" height="20" rx="2" fill="#BFDBFE"/>
  <!-- Wheels -->
  <circle cx="28" cy="75" r="10" fill="#1F2937"/>
  <circle cx="28" cy="75" r="5" fill="#6B7280"/>
  <circle cx="72" cy="75" r="10" fill="#1F2937"/>
  <circle cx="72" cy="75" r="5" fill="#6B7280"/>
  <!-- Route line -->
  <path d="M5 18 Q 30 5, 50 18 T 95 18" stroke="#10B981" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Location pin -->
  <circle cx="95" cy="18" r="6" fill="#EF4444"/>
  <circle cx="95" cy="18" r="2" fill="white"/>
</svg>
