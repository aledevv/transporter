<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Soft rounded background -->
  <rect x="10" y="10" width="80" height="80" rx="24" fill="#3B82F6" />
  
  <!-- Minimal Bus Body -->
  <rect x="30" y="32" width="40" height="36" rx="8" fill="white" />
  
  <!-- Windshield -->
  <rect x="34" y="36" width="32" height="14" rx="4" fill="#93C5FD" />
  
  <!-- Headlights -->
  <circle cx="38" cy="60" r="2" fill="#3B82F6" />
  <circle cx="62" cy="60" r="2" fill="#3B82F6" />
  
  <!-- Wheels -->
  <circle cx="38" cy="70" r="5" fill="#1E40AF" />
  <circle cx="62" cy="70" r="5" fill="#1E40AF" />
</svg>
